<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9f1f5" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Sai Charan Reddy — AI/ML and full-stack developer. Explore projects, technical skills, and tailored resumes." />
    <title>Sai Charan Reddy — AI/ML & Full-Stack Developer</title>
    <script>
      window.addEventListener('error', event => {
        const element = event.target;
        if (element instanceof HTMLScriptElement && element.type === 'module') {
          if (window.portfolioBoot) window.portfolioBoot.fail();
          else window.__portfolioModuleFailed = true;
        }
      }, true);
    </script>
    <style>
      html,body{margin:0;min-height:100%;background:#08090b}
      .is-booting #root{visibility:hidden}
      #portfolio-boot{position:fixed;inset:0;z-index:2147483647;background:#08090b;color:#f4f5f6;opacity:1;transition:opacity .24s ease;display:block}
      #portfolio-boot.is-exiting{opacity:0}
      .boot-content{position:absolute;top:46%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:46px}
      .boot-logo{width:62px;height:76px;display:block;fill:#f6f6f7}
      .boot-track{width:164px;height:5px;overflow:hidden;border-radius:999px;background:#3d4044}
      .boot-fill{display:block;width:100%;height:100%;border-radius:inherit;background:#e3e6e8;transform:scaleX(.04);transform-origin:left;transition:transform .22s ease-out}
      .boot-error{display:none;max-width:280px;text-align:center;font:14px/1.5 system-ui,sans-serif;color:#d9dee2}
      .boot-error button{margin-top:12px;padding:8px 16px;color:#fff;background:#30363c;border:1px solid #76818a;border-radius:7px;cursor:pointer}
      #portfolio-boot.has-error .boot-error{display:block}
      #portfolio-boot.has-error .boot-track{display:none}
      @media(max-width:767px){.boot-logo{width:55px;height:68px}.boot-content{gap:40px}.boot-track{width:144px}}
      @media(prefers-reduced-motion:reduce){#portfolio-boot,.boot-fill{transition:none}}
    </style>
  </head>
  <body>
    <div id="portfolio-boot" role="status" aria-live="polite" aria-label="Loading portfolio">
      <div class="boot-content">
        <svg class="boot-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.7 2.1c.2 1.5-.5 3-1.4 4.1-.9 1-2.2 1.7-3.5 1.6-.2-1.4.5-2.8 1.4-3.8 1-1.1 2.5-1.8 3.5-1.9zM20.2 16.7c-.5 1.2-.8 1.8-1.5 2.8-.9 1.4-2.2 3.1-3.8 3.1-1.4 0-1.8-.9-3.6-.9s-2.3.9-3.7.9c-1.6.1-2.8-1.5-3.7-2.9-2.5-3.8-2.8-8.2-1.2-10.6 1.1-1.7 2.9-2.7 4.6-2.7 1.7 0 2.8.9 4.2.9 1.4 0 2.3-.9 4.2-.9 1.5 0 3.1.8 4.2 2.2-3.7 2-3.1 7.2.3 8.1z"/></svg>
        <div class="boot-track" role="progressbar" aria-label="Loading portfolio"><span class="boot-fill"></span></div>
        <div class="boot-error">The portfolio could not start. Please try reloading.<br/><button type="button" onclick="location.reload()">Reload</button></div>
        <noscript><style>.boot-track{display:none}.boot-error{display:block}</style><p class="boot-error">JavaScript is required to open this portfolio.</p></noscript>
      </div>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script>
      (() => {
        const boot = document.getElementById('portfolio-boot');
        const fill = boot.querySelector('.boot-fill');
        const root = document.getElementById('root');
        const started = performance.now();
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let state = 'loading';
        const watchdog = setTimeout(() => fail(), 15000);
        function fail() {
          if (state === 'done' || state === 'failed') return;
          state = 'failed'; clearTimeout(watchdog);
          boot.classList.add('has-error');
          boot.setAttribute('aria-label', 'Portfolio could not start');
          boot.querySelector('button').focus();
        }
        function finish() {
          if (state !== 'assets') return;
          state = 'finishing'; clearTimeout(watchdog);
          fill.style.transform = 'scaleX(1)';
          const hold = reduced ? 0 : Math.max(220, 450 - (performance.now() - started));
          setTimeout(() => {
            if (state !== 'finishing') return;
            document.documentElement.classList.remove('is-booting');
            boot.classList.add('is-exiting');
            setTimeout(() => {
              root.removeAttribute('inert'); root.removeAttribute('aria-hidden');
              boot.remove(); state = 'done';
            }, reduced ? 0 : 240);
          }, hold);
        }
        window.portfolioBoot = {
          fail,
          ready() {
            if (state !== 'loading') return;
            state = 'assets'; fill.style.transform = 'scaleX(.6)';
            let theme = 'system';
            try { theme = localStorage.getItem('portfolio-theme') || 'system'; } catch {}
            const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
            const image = new Image();
            const fallback = setTimeout(finish, 1800);
            const settled = () => { clearTimeout(fallback); finish(); };
            image.onload = settled; image.onerror = settled;
            image.src = dark ? '/wallpapers/dark.png' : '/wallpapers/light.webp';
          }
        };
        window.addEventListener('error', event => { if (event.target === window && (state === 'loading' || state === 'assets')) fail(); });
        if (window.__portfolioModuleFailed) fail();
        requestAnimationFrame(() => { if (state === 'loading') fill.style.transform = 'scaleX(.22)'; });
      })();
    </script>
    <script type="module" src="/src/main.jsx" onerror="window.portfolioBoot.fail()"></script>
  </body>
</html>
